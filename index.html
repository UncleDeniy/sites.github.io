<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Настройки PWA для iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мои сайты">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="manifest" href="./manifest.json">
<title>Веб-хаб проектов</title>
<style>
  :root {
    --bg: #0b0e14;
    --card: #141923;
    --border: #252d3d;
    --text: #e2e8f0;
    --muted: #8a94a6;
    --accent: #3b82f6;
    --pink: #ec4899;
    --green: #10b981;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    margin: 0;
    /* Учёт безопасных отступов iPhone (Dynamic Island и нижняя полоска) */
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    line-height: 1.5;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 { font-size: 24px; margin: 0 0 4px; color: #fff; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .search {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: #fff;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 16px; /* 16px предотвращает автозум экрана в iOS */
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 24px 0 10px;
    font-weight: 700;
  }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .card {
    display: block;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: transform 0.1s, background 0.15s;
  }
  .card:active { transform: scale(0.98); background: #1b2230; }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .card-title { font-size: 17px; font-weight: 700; color: #fff; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
  .tag-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
  .tag-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  .tag-pink { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
  .card-desc { font-size: 13px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Веб-хаб</h1>
    <div class="subtitle">Мои приложения и проекты для Сони</div>
    <input type="search" class="search" id="searchInput" placeholder="Поиск по проектам..." oninput="filterCards()">
  </header>

  <div class="section-title">Мои проекты</div>
  <div class="grid">
    <a href="./minsk-plan/" class="card">
      <div class="card-top">
        <span class="card-title">Minsk 2032</span>
        <span class="tag tag-green">Финансы</span>
      </div>
      <p class="card-desc">Накопления, автокурс BYN/USD, график вкладов и расчёт переезда.</p>
    </a>

    <a href="./syslog-news/" class="card">
      <div class="card-top">
        <span class="card-title">SYSLOG NEWS</span>
        <span class="tag tag-blue">IT / Новости</span>
      </div>
      <p class="card-desc">Олдскульная IT-газета без лишнего шума.</p>
    </a>
  </div>

  <div class="section-title">Для Сони</div>
  <div class="grid">
    <a href="./sonya-plan/" class="card">
      <div class="card-top">
        <span class="card-title">Финансы и планы Сони</span>
        <span class="tag tag-pink">Соня</span>
      </div>
      <p class="card-desc">Личный трекер целей и накоплений с графиками и автокурсом.</p>
    </a>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  function filterCards() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      card.style.display = card.textContent.toLowerCase().includes(q) ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
